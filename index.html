<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meme Forge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Meme Forge</h1>
    <p class="tag">Pick a template, add your text, download.</p>
  </header>

  <main>
    <!-- Template gallery -->
    <section id="gallery-view">
      <div class="gallery-controls">
        <input id="search" type="search" placeholder="Search templates (e.g. drake, distracted)…" autocomplete="off">
        <label class="btn secondary upload">
          Upload your own image
          <input id="upload" type="file" accept="image/*" hidden>
        </label>
      </div>
      <p id="gallery-status" class="status">Loading templates…</p>
      <div id="gallery" class="gallery"></div>
    </section>

    <!-- Editor -->
    <section id="editor-view" hidden>
      <button id="back" class="btn link">&larr; All templates</button>
      <div class="editor">
        <div class="canvas-wrap">
          <canvas id="canvas"></canvas>
          <p class="hint">Drag text on the image to move it.</p>
        </div>
        <aside class="panel">
          <h2 id="template-name"></h2>
          <div id="layers"></div>
          <button id="add-text" class="btn secondary">+ Add text box</button>

          <fieldset>
            <legend>Style (all text)</legend>
            <label>Font
              <select id="font">
                <option value="Impact, 'Anton', 'Arial Black', sans-serif">Impact</option>
                <option value="Arial, Helvetica, sans-serif">Arial</option>
                <option value="'Comic Sans MS', 'Comic Neue', cursive">Comic Sans</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Courier New', monospace">Courier</option>
              </select>
            </label>
            <label>Text colour <input id="color" type="color" value="#ffffff"></label>
            <label>Outline colour <input id="stroke" type="color" value="#000000"></label>
            <label class="check"><input id="uppercase" type="checkbox" checked> ALL CAPS</label>
          </fieldset>

          <div class="actions">
            <button id="download" class="btn primary">Download PNG</button>
            <button id="copy" class="btn secondary">Copy image</button>
          </div>
          <p id="editor-status" class="status"></p>
        </aside>
      </div>
    </section>
  </main>

  <footer>Templates via the public <a href="https://imgflip.com/api" target="_blank" rel="noopener">Imgflip API</a>. Images are generated in your browser — nothing is uploaded.</footer>

  <script src="app.js"></script>
</body>
</html>
